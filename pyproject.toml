[project]
name = "lunar-sandbox"
version = "0.6.0"
description = "Linux namespace sandboxes with OverlayFS, cgroups v2, and seccomp-bpf for AI agent evaluation"
readme = "README.md"
authors = [
    { name = "Diogo vieira", email = "diogobgff@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "pydantic>=2.12",
    "pyseccomp>=0.1",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "typer>=0.21.0",
    "rich>=14.0",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
parquet = ["pyarrow>=17.0"]
notebook = ["nest_asyncio>=1.6"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
lunar = "lunar_sandbox.cli.main:app"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
